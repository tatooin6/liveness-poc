<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Expression Detection</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main class="demo-container">
      <label class="lang-toggle" for="lang-select">
        <span class="sr-only">Language</span>
        <select id="lang-select">
          <option value="es" selected>Español</option>
          <option value="en">English</option>
        </select>
      </label>
      <div class="grid">
        <h1 id="page-title">Face Expression Detection (Demo)</h1>
        <div class="control-buttons">
          <button id="start-liveness" type="button">Start Liveness</button>
        </div>
        <p id="expression-status" class="status muted">Expression: click start to begin detection.</p>
      </div>
      <div class="grid">
        <section>
          <video id="live-video" width="640" height="480" autoplay muted playsinline></video>
        </section>
        <section class="panel">
          <h3 id="expression-checklist-title">Expression Checklist</h3>
          <p>
            <span id="expression-tip-prefix">Hold a</span>
            <strong id="currentExpression">happy</strong>
            <span id="expression-tip-suffix">expression for 5 seconds to mark it as completed.</span>
          </p>
          <ul class="expression-list">
            <li class="expression-item">
              <div class="expression-control">
                <input type="checkbox" id="expr-happy-checkbox" />
                <label id="label-happy" for="expr-happy-checkbox">Happy</label>
              </div>
              <div class="expression-progress">
                <progress id="expr-happy-progress" max="100" value="0"></progress>
                <span id="expr-happy-percent" class="progress-value">0%</span>
              </div>
            </li>
            <li class="expression-item">
              <div class="expression-control">
                <input type="checkbox" id="expr-sad-checkbox" />
                <label id="label-sad" for="expr-sad-checkbox">Sad</label>
              </div>
              <div class="expression-progress">
                <progress id="expr-sad-progress" max="100" value="0"></progress>
                <span id="expr-sad-percent" class="progress-value">0%</span>
              </div>
            </li>
            <li class="expression-item">
              <div class="expression-control">
                <input type="checkbox" id="expr-angry-checkbox" />
                <label id="label-angry" for="expr-angry-checkbox">Angry</label>
              </div>
              <div class="expression-progress">
                <progress id="expr-angry-progress" max="100" value="0"></progress>
                <span id="expr-angry-percent" class="progress-value">0%</span>
              </div>
            </li>
            <li class="expression-item">
              <div class="expression-control">
                <input type="checkbox" id="expr-fearful-checkbox" />
                <label id="label-fearful" for="expr-fearful-checkbox">Fearful</label>
              </div>
              <div class="expression-progress">
                <progress id="expr-fearful-progress" max="100" value="0"></progress>
                <span id="expr-fearful-percent" class="progress-value">0%</span>
              </div>
            </li>
            <li class="expression-item">
              <div class="expression-control">
                <input type="checkbox" id="expr-disgusted-checkbox" />
                <label id="label-disgusted" for="expr-disgusted-checkbox">Disgusted</label>
              </div>
              <div class="expression-progress">
                <progress id="expr-disgusted-progress" max="100" value="0"></progress>
                <span id="expr-disgusted-percent" class="progress-value">0%</span>
              </div>
            </li>
            <li class="expression-item">
              <div class="expression-control">
                <input type="checkbox" id="expr-surprised-checkbox" />
                <label id="label-surprised" for="expr-surprised-checkbox">Surprised</label>
              </div>
              <div class="expression-progress">
                <progress id="expr-surprised-progress" max="100" value="0"></progress>
                <span id="expr-surprised-percent" class="progress-value">0%</span>
              </div>
            </li>
          </ul>
        </section>
      </div>
    </main>
    <script src="../node_modules/face-api.js/dist/face-api.min.js"></script>
    <script src="./scripts/liveness.js" type="module"></script>
  </body>
</html>
